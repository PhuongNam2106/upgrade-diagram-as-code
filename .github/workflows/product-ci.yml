name: Product CI

on:
  push:
    branches: [main]
    paths:
      - "product/**"
      - ".github/workflows/product-ci.yml"
  pull_request:
    paths:
      - "product/**"
      - ".github/workflows/product-ci.yml"

jobs:
  changes:
    name: Detect affected product areas
    runs-on: ubuntu-24.04
    outputs:
      compose: ${{ steps.filter.outputs.compose }}
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          fi

          compose=false
          windows=false
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"

          while IFS= read -r file; do
            case "$file" in
              .github/workflows/product-ci.yml)
                compose=true
                windows=true
                ;;
              product/deploy/*|product/gateway/*|product/packages/contracts/*|product/scripts/smoke-test.mjs|product/scripts/determinism-test.mjs|product/package.json|product/package-lock.json|product/tsconfig.base.json)
                compose=true
                ;;
            esac

            case "$file" in
              .github/workflows/product-ci.yml|product/windows-installer/*|product/scripts/create-server-bundle.mjs|product/scripts/create-server-bundle.test.mjs|product/scripts/test-windows-installer-contract.mjs|product/package.json|product/package-lock.json)
                windows=true
                ;;
            esac
          done < "$RUNNER_TEMP/changed-files.txt"

          echo "compose=$compose" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "Compose tests required: $compose"
          echo "Windows installer tests required: $windows"

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/package-lock.json
      - run: npm ci
        working-directory: product
      - run: npm audit
        working-directory: product
      - run: npm run typecheck
        working-directory: product
      - run: npm test
        working-directory: product
      - run: npm run build
        working-directory: product
      - name: Ensure the committed Action bundle is current
        run: git diff --exit-code -- product/github-action/dist/index.cjs
      - name: Package Marketplace VSIX
        run: npm --workspace=diagram-as-code-vscode run package
        working-directory: product
      - uses: actions/upload-artifact@v6
        with:
          name: diagram-as-code-vscode
          path: product/vscode-extension/dist/*.vsix

  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Start rendering stack
        env:
          DIAGRAM_API_KEYS: ci-secret
          GATEWAY_PORT: 19000
        run: docker compose -p diagram-product-ci --env-file .env.example up -d --build
        working-directory: product/deploy
      - name: Smoke renderers
        env:
          DIAGRAM_GATEWAY_URL: http://localhost:19000
          DIAGRAM_API_KEY: ci-secret
        run: node scripts/smoke-test.mjs
        working-directory: product
      - name: Verify deterministic renderer output without Gateway cache
        run: docker compose -p diagram-product-ci --env-file .env.example exec -T -e KROKI_DIRECT_URL=http://kroki:8000 gateway node scripts/determinism-test.mjs
        working-directory: product/deploy
      - name: Show container logs
        if: failure()
        run: docker compose -p diagram-product-ci --env-file .env.example logs --no-color --tail=300
        working-directory: product/deploy
      - name: Stop rendering stack
        if: always()
        run: docker compose -p diagram-product-ci --env-file .env.example down --volumes --remove-orphans
        working-directory: product/deploy

  windows-installer:
    name: Windows installer
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Install Pester
        shell: powershell
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Test static installer contract
        run: npm run test:installer-contract
      - name: Test with Windows PowerShell 5.1
        shell: powershell
        run: Invoke-Pester .\windows-installer\test -CI -Output Detailed
      - name: Test with PowerShell 7
        shell: pwsh
        run: Invoke-Pester .\windows-installer\test -CI -Output Detailed
