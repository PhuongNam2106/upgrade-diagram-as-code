name: diagram-as-code

services:
  gateway:
    image: ${GATEWAY_IMAGE:-diagram-as-code-gateway:local}
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    environment:
      AUTH_MODE: required
      DIAGRAM_API_KEYS: ${DIAGRAM_API_KEYS:?Set DIAGRAM_API_KEYS in product/deploy/.env}
      KROKI_BASE_URL: http://kroki:8000
      RENDERER_VERSION: kroki-0.31.1
      MAX_SOURCE_BYTES: 1048576
      RENDER_TIMEOUT_MS: 10000
      CACHE_MAX_ENTRIES: 500
    depends_on:
      - kroki
    ports:
      - "${GATEWAY_PORT:-9000}:9000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:9000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - rendering

  kroki:
    image: ${KROKI_IMAGE:-yuzutech/kroki:0.31.1}
    environment:
      KROKI_MERMAID_HOST: mermaid
      KROKI_SAFE_MODE: secure
      KROKI_MAX_BODY_SIZE: 1mb
    depends_on:
      - mermaid
    expose:
      - "8000"
    tmpfs:
      - /tmp:exec
    restart: unless-stopped
    networks:
      - rendering

  mermaid:
    image: ${MERMAID_IMAGE:-yuzutech/kroki-mermaid:0.31.1}
    expose:
      - "8002"
    restart: unless-stopped
    networks:
      - rendering

networks:
  rendering:
    internal: false
